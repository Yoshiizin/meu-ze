<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
<title id="title">Meu Zé 2.0 — a internet é nossa</title>
<desc id="description">Banner promocional ilustrativo com visual editorial retrô, dinossauro e cartões de feed, chat e perfil. Não é captura de tela real.</desc>
