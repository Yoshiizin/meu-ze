plugins {
    id 'com.android.application'
}
def safeEnv = { name -> (System.getenv(name) ?: '').replace('\\', '\\\\').replace('"', '\\"') }
android {
    namespace 'com.meuze.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.meuze.app'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'FCM_APP_ID', '"' + safeEnv('FCM_APP_ID') + '"'
        buildConfigField 'String', 'FCM_API_KEY', '"' + safeEnv('FCM_API_KEY') + '"'
        buildConfigField 'String', 'FCM_SENDER_ID', '"' + safeEnv('FCM_SENDER_ID') + '"'
        buildConfigField 'String', 'FCM_PROJECT_ID', '"' + safeEnv('FCM_PROJECT_ID') + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
}
