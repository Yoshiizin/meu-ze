name: Meu Zé Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, android-app-pwa, android-background-push]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
      FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
      FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
      FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android SDK manager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare direct-download APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.FCM_APP_ID != '' && env.FCM_API_KEY != '' && env.FCM_SENDER_ID != '' && env.FCM_PROJECT_ID != ''
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Meu-Ze.apk
      - name: Publish APK on GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.FCM_APP_ID != '' && env.FCM_API_KEY != '' && env.FCM_SENDER_ID != '' && env.FCM_PROJECT_ID != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v1.1.0 >/dev/null 2>&1; then
            echo "Release android-v1.1.0 already exists. Not overwriting signed APK."
          else
            gh release create android-v1.1.0 Meu-Ze.apk \
              --title "Meu Zé para Android v1.1.0 (teste)" \
              --notes "APK de teste do Meu Zé, com ícone do dinossaurinho. Instale no Android 10 ou superior. O iPhone usa https://meu-ze.vercel.app/ pelo Safari > Adicionar à Tela de Início. Este APK inclui integração Firebase FCM para notificações pop-up com sons por conversa. Configure as variáveis Firebase no GitHub e as credenciais do servidor na Vercel. APK de teste: futuras versões podem exigir reinstalação." \
              --latest
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Ze-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
